name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check publication helper
        run: python -m unittest discover -s scripts/tests -v
      - name: Install Python dependencies
        run: python -m pip install -r jobfind/requirements.txt -r jobfind/requirements-wireless.txt
      - name: Install browser for synthetic browser regression tests
        run: python -m playwright install chromium
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run regression suite
        shell: cmd
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: jobfind\test.bat
