[package]
name = "findall-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
